<app-pixel-panel title="Iniciar sesión" class="login">
  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }

  <form (submit)="$event.preventDefault(); submit()">
    <app-pixel-input label="Correo" type="email" autocomplete="email" [value]="email()" (valueChange)="email.set($event)" />
    <app-pixel-input
      label="Contraseña"
      type="password"
      autocomplete="current-password"
      [value]="password()"
      (valueChange)="password.set($event)"
    />
    <app-pixel-button type="submit" [disabled]="busy() || !email().trim() || !password()">Iniciar sesión</app-pixel-button>
  </form>

  <div class="divider"><span>o</span></div>

  <app-pixel-button variant="secondary" [disabled]="busy()" (click)="signInWithGoogle()">
    <span class="google-button-content">
      <img src="/icons/google.webp" alt="" width="18" height="18" />
      Iniciar sesión con Google
    </span>
  </app-pixel-button>

  <p class="switch">
    ¿No tienes cuenta?
    <button type="button" class="link" (click)="switchToSignup.emit()">Crear cuenta</button>
  </p>
</app-pixel-panel>
